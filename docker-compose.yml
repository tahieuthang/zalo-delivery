services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: zalo_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      CLUSTER_ID: 'zalo-delivery-cluster-001'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OSRM: uncomment sau khi đã pre-process map data VN
  # Xem docs/skills/osrm-route.md để hướng dẫn setup
  # osrm:
  #   image: osrm/osrm-backend
  #   ports:
  #     - '5000:5000'
  #   volumes:
  #     - ./osrm-data:/data
  #   command: osrm-routed --algorithm mld /data/vietnam-latest.osrm

  # Backend Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zalo_delivery?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:9094
      - OSRM_URL=https://router.project-osrm.org
      - GOONG_API_KEY=${GOONG_API_KEY}
      - ZALO_OA_ID=${ZALO_OA_ID}
      - ZALO_APP_ID=${ZALO_APP_ID}
      - ZALO_APP_SECRET=${ZALO_APP_SECRET}
      - NOTIFICATION_PROVIDER=zalo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    command: npx ts-node -r tsconfig-paths/register scripts/shipper-simulator.ts
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zalo_delivery?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKER=kafka:9094
      - OSRM_URL=https://router.project-osrm.org
      - GOONG_API_KEY=${GOONG_API_KEY}
      - SOCKET_TOKEN=zalo-delivery-secret-token
      - SOCKET_URL=http://app:3000/tracking
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  pgdata:
  redisdata:
